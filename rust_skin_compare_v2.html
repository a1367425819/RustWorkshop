
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rust Skin Price Compare</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; padding: 20px; }
        h1 { text-align: center; }
        input[type="text"] {
            width: 300px;
            padding: 10px;
            margin: 20px auto;
            display: block;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #343a40; color: white; cursor: pointer; }
        tr:hover { background-color: #f1f1f1; }
        .positive { color: green; }
        .negative { color: red; }
        .skin-img { width: 50px; height: auto; vertical-align: middle; margin-right: 8px; }
    </style>
</head>
<body>
    <h1>Rust Skin Price Comparison</h1>
    <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="Search for skins...">

    <table id="skinTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Skin</th>
                <th onclick="sortTable(1)">Steam Price (USD)</th>
                <th onclick="sortTable(2)">Skinport Price (EUR)</th>
                <th onclick="sortTable(3)">Difference</th>
                <th onclick="sortTable(4)">Diff %</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="https://skins.static-skins.com/rust/items/Tempered_AK47.png" class="skin-img">Tempered AK47</td>
                <td>$15.20</td>
                <td>€10.00</td>
                <td class="negative">-5.20</td>
                <td class="negative">-34.21%</td>
            </tr>
            <tr>
                <td><img src="https://skins.static-skins.com/rust/items/Big_Grin.png" class="skin-img">Big Grin</td>
                <td>$960.00</td>
                <td>€825.00</td>
                <td class="negative">-135.00</td>
                <td class="negative">-14.06%</td>
            </tr>
            <tr>
                <td><img src="https://skins.static-skins.com/rust/items/Glory_AK47.png" class="skin-img">Glory AK47</td>
                <td>$230.00</td>
                <td>€195.00</td>
                <td class="negative">-35.00</td>
                <td class="negative">-15.22%</td>
            </tr>
        </tbody>
    </table>

    <script>
        function searchTable() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let rows = document.querySelectorAll("#skinTable tbody tr");
            rows.forEach(row => {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(input) ? "" : "none";
            });
        }

        function sortTable(n) {
            let table = document.getElementById("skinTable");
            let switching = true;
            let dir = "asc";
            let rows, i, x, y, shouldSwitch, switchcount = 0;
            while (switching) {
                switching = false;
                rows = table.rows;
                for (i = 1; i < rows.length - 1; i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[n];
                    y = rows[i + 1].getElementsByTagName("TD")[n];
                    let xContent = x.innerText.replace(/[$€,%]/g, '');
                    let yContent = y.innerText.replace(/[$€,%]/g, '');
                    if (!isNaN(parseFloat(xContent)) && !isNaN(parseFloat(yContent))) {
                        if ((dir == "asc" && parseFloat(xContent) > parseFloat(yContent)) ||
                            (dir == "desc" && parseFloat(xContent) < parseFloat(yContent))) {
                            shouldSwitch = true;
                            break;
                        }
                    } else {
                        if ((dir == "asc" && xContent > yContent) ||
                            (dir == "desc" && xContent < yContent)) {
                            shouldSwitch = true;
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }
    </script>
</body>
</html>
